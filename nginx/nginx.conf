# Entry point
# TODO (jwj):
# * Preserve log files

events {
    # Max number of simultaneous connections per worker process
    # See worker_processes and worker_rlimit_nofile.
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Proxy header
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout settings
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Max client body size
    client_max_body_size 50m;

    # Logging
    # NOTE: Logs are redirected to /dev/stdout and /dev/stderr in the container
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    map $http_user_agent $not_prom {
        # Skip Prometheus logs
        default 1;
        "Prometheus/2.51.2" 0;
    }
    access_log /var/log/nginx/access.log main if=$not_prom;

    # Include modular configs
    incude /etc/nginx/conf.d/*.conf;
}
